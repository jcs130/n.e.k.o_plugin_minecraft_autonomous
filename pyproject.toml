[project]
name = "minecraft_autonomous"
version = "0.5.4"
description = "Thin N.E.K.O adapter for the host-neutral Minecraft autonomy framework"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
  "agent-mc-autonomy @ git+https://github.com/jcs130/minecraft-ai-friend.git@c7a383dc7f7001f5cee8861cf2d08a3d4a4c5fd8#subdirectory=packages/agent-mc-autonomy",
  "mcp==2.1.1", "httpx>=0.27,<1", "openai>=1,<3"
]

[project.urls]
Repository = "https://github.com/jcs130/n.e.k.o_plugin_minecraft_autonomous"
Issues = "https://github.com/jcs130/n.e.k.o_plugin_minecraft_autonomous/issues"

[tool.neko.build]
exclude_dirs = ["tests", "docs", "local", "runtime", "logs"]
exclude_files = ["AGENTS.md", "CONTRIBUTING.md", "ruff.toml", ".gitignore", ".gitattributes", ".editorconfig"]
exclude = [".env", ".env.*", "*.key", "*.pem", "*.log", "*.local.toml"]
