[project]
name = "minecraft_autonomous"
version = "0.5.47"
description = "Thin N.E.K.O adapter for the host-neutral Minecraft autonomy framework"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
  "agent-mc-autonomy @ git+https://github.com/jcs130/minecraft-ai-friend.git@18c1758705b3ffafe217bae235c41b35b9808118#subdirectory=packages/agent-mc-autonomy",
  "mcp==2.1.1", "httpx>=0.27,<1", "openai>=1,<3"
]

[project.urls]
Repository = "https://github.com/jcs130/n.e.k.o_plugin_minecraft_autonomous"
Issues = "https://github.com/jcs130/n.e.k.o_plugin_minecraft_autonomous/issues"

[tool.neko.build]
exclude_dirs = ["tests", "docs", "tasks", "local", "runtime", "logs", ".superpowers"]
exclude_files = ["AGENTS.md", "CONTRIBUTING.md", "ruff.toml", ".gitignore", ".gitattributes", ".editorconfig"]
exclude = [".env", ".env.*", "*.key", "*.log", "*.local.toml"]

# Official excludes run before includes. These suffix-complement patterns keep
# every non-PEM path plus exactly Certifi's public CA trust store; arbitrary
# root/nested PEM credentials remain excluded. Do not use include=["**"].
include = ["*[!mM]", "*[!eE][mM]", "*[!pP][eE][mM]", "*[!.][pP][eE][mM]", "m", "em", "pem", "vendor/certifi/cacert.pem"]
