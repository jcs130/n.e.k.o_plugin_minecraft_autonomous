[plugin]
id = "minecraft_autonomous"
name = "千灯纪 · Agent友好的我的世界RPG服"
version = "0.6.162"
type = "plugin"
entry = "plugin.plugins.minecraft_autonomous:MinecraftAutonomousPlugin"
description = "把猫娘带进《我的世界》。在千灯纪连接自己的车万女仆或 Numen，也可以让猫娘以玩家身份进服探索、采集和建造，通过 Simple Voice Chat 和附近同伴交流。支持自有服务器、3D 观战和本机解说。"
short_description = "千灯纪居民连接与 Minecraft 1.21.1 自主游玩"
keywords = ["Minecraft", "我的世界", "自主生存"]

[plugin.author]
name = "jcs130"
url = "https://github.com/jcs130"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.models.decision]
label = "Minecraft autonomous decisions / 我的世界自主决策"
required = false
capabilities = ["text", "tool_calling"]

[plugin.models.vision]
label = "Optional Minecraft vision / 可选图像决策（可绑定同一个多模态模型）"
required = false
capabilities = ["text", "image_input", "tool_calling"]

[plugin.models.fast]
label = "Optional fast focus / 可选快速选择（聊天模型槽）"
required = false
capabilities = ["text", "tool_calling"]

[plugin.ui]
enabled = true
expose_legacy_static_panel = false

[[plugin.ui.panel]]
id = "main"
title = "配置与控制"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.panel]]
id = "resident"
title = "连接车万女仆"
mode = "hosted-tsx"
entry = "ui/resident-panel.tsx"
context = "resident_connection"
permissions = ["state:read", "action:call"]

[[plugin.ui.panel]]
id = "viewer"
title = "观战与状态"
mode = "static"
entry = "static/index.html"
open_in = "iframe"
context = "dashboard"
permissions = ["state:read"]
