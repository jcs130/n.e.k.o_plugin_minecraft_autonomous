[plugin]
id = "minecraft_autonomous"
name = "千灯纪 · Agent友好的我的世界RPG服"
version = "0.6.151"
type = "plugin"
entry = "plugin.plugins.minecraft_autonomous:MinecraftAutonomousPlugin"
description = "把猫娘带进《我的世界》，成为一起探索、采集和建造的联机伙伴。听她分享冒险见闻，打开 3D 观战陪她看日出，也可以亲自进服一起玩。支持自己的服务器与千灯纪免邀请码体验，沿用 Neko 模型和声音，准备好后点一下开始。"
short_description = "Minecraft 1.21.1 自主游玩与猫娘解说"
keywords = ["Minecraft", "我的世界", "自主生存"]

[plugin.author]
name = "jcs130"
url = "https://github.com/jcs130"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.models.decision]
label = "Minecraft autonomous decisions / 我的世界自主决策"
required = false
capabilities = ["text", "tool_calling"]

[plugin.models.vision]
label = "Optional Minecraft vision / 可选图像决策（可绑定同一个多模态模型）"
required = false
capabilities = ["text", "image_input", "tool_calling"]

[plugin.models.fast]
label = "Optional fast focus / 可选快速选择（聊天模型槽）"
required = false
capabilities = ["text", "tool_calling"]

[plugin.ui]
enabled = true
expose_legacy_static_panel = false

[[plugin.ui.panel]]
id = "main"
title = "配置与控制"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.panel]]
id = "viewer"
title = "观战与状态"
mode = "static"
entry = "static/index.html"
open_in = "iframe"
context = "dashboard"
permissions = ["state:read"]
