name: Windows desktop candidate acceptance
on:
  push:
    branches: [release/qa-win-managed-06160-20261121]
    paths: [.github/workflows/qa-windows-06160.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PLUGIN_ID: minecraft_autonomous
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: plugin-repo
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Project-N-E-K-O/N.E.K.O
          ref: ca61a4eb4344b2c4673536f9d8a9a62518927df3
          path: neko
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Prepare pinned SDK and plugin layout
        run: |
          python -m pip install uv==0.12.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $PWD 'neko/plugin/plugins/minecraft_autonomous'
          if (Test-Path -LiteralPath $target) { throw 'Plugin path already present in SDK checkout' }
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          Copy-Item -LiteralPath 'plugin-repo' -Destination $target -Recurse
          uv sync --project neko --locked --no-dev --no-install-project --python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synchronize exact pinned plugin dependencies
        working-directory: neko
        run: uv run --with pip python -m plugin.neko_plugin_cli.cli sync minecraft_autonomous --clean
      - name: Run official release validation
        working-directory: neko
        run: |
          uv run --with pytest --with pytest-randomly python -m plugin.neko_plugin_cli.cli check -r minecraft_autonomous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = 'plugin/neko_plugin_cli/target/minecraft_autonomous.neko-plugin'
          if (-not (Test-Path -LiteralPath $package)) { throw 'Official release validation produced no Windows package' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $package | ConvertTo-Json | Set-Content -LiteralPath 'plugin/neko_plugin_cli/target/package-hash.json' -Encoding UTF8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qiandengji-minecraft-autonomous-0.6.160-windows-verification
          path: |
            neko/plugin/neko_plugin_cli/target/minecraft_autonomous.neko-plugin
            neko/plugin/neko_plugin_cli/target/package-hash.json
          if-no-files-found: error
